<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pot Farm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --text: #1d211c; --muted: #6b7168; --line: #e2e5df;
    --track: #e9ece6; --grow: #4f9d5d; --grow2: #7cc287; --ready: #e0a21b; --bad: #c8483c;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121512; --card: #1b1f1b; --text: #e8ebe6; --muted: #949a91; --line: #2a302a;
      --track: #262c26; --grow: #5fb46d; --grow2: #8fd59a; --ready: #f0b43a; --bad: #e0675b;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121512; --card: #1b1f1b; --text: #e8ebe6; --muted: #949a91; --line: #2a302a;
    --track: #262c26; --grow: #5fb46d; --grow2: #8fd59a; --ready: #f0b43a; --bad: #e0675b;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, "Segoe UI", Arial, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--grow); box-shadow: 0 0 0 4px color-mix(in srgb, var(--grow) 25%, transparent); }
  .dot.off { background: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; }
  .inv { margin-bottom: 16px; }
  .inv .thead { margin-bottom: 12px; }
  .inv img { display: block; width: 100%; height: auto; border-radius: 10px; background: var(--track); }
  .inv .empty { padding: 36px 12px; text-align: center; color: var(--muted); background: var(--track); border-radius: 10px; font-size: 14px; }
  .tables { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .thead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; gap: 8px; }
  .thead h2 { font-size: 18px; margin: 0; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--track); color: var(--muted); white-space: nowrap; }
  .badge.fast { background: color-mix(in srgb, var(--grow) 18%, transparent); color: var(--grow); }
  .pot + .pot { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .prow { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; gap: 8px; }
  .prow b { font-weight: 600; }
  .eta { font-variant-numeric: tabular-nums; color: var(--muted); }
  .eta.ready { color: var(--ready); font-weight: 600; }
  .bar { height: 16px; background: var(--track); border-radius: 99px; overflow: hidden; position: relative; }
  .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--grow), var(--grow2)); transition: width .9s linear; }
  [dir="rtl"] .fill { background: linear-gradient(270deg, var(--grow), var(--grow2)); }
  .fill.ready { background: var(--ready); animation: pulse 1.4s ease-in-out infinite; }
  .fill.unknown { width: 100% !important; opacity: .35;
    background: repeating-linear-gradient(45deg, var(--muted) 0 8px, transparent 8px 16px); }
  @keyframes pulse { 50% { opacity: .65; } }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .problem { margin-bottom: 16px; border-color: var(--bad); color: var(--bad); font-weight: 600; }
  .problem small { display: block; font-weight: 400; color: var(--muted); margin-top: 4px; }
  .err { margin-top: 16px; color: var(--bad); font-size: 14px; }
  footer { margin-top: 22px; color: var(--muted); font-size: 13px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } .fill.ready { animation: none; } }
  .shots { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 16px; align-items: start; }
  .shot .thead { margin-bottom: 12px; }
  .shot img { display: block; width: 100%; height: auto; border-radius: 10px; background: var(--track); cursor: zoom-in; }
  .shot .empty { padding: 36px 12px; text-align: center; color: var(--muted); background: var(--track); border-radius: 10px; font-size: 14px; }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-inline-end: 6px; animation: pulse 1.4s ease-in-out infinite; vertical-align: middle; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🌱 החווה שלי</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="stxt">טוען…</span></div>
  </header>

  <section class="card problem" id="problem" hidden></section>

  <section class="tables" id="tables"></section>

  <section class="shots">
    <article class="card shot">
      <div class="thead"><h2><span class="live"></span>מסך המשחק</h2><span class="badge" id="scrlbl">–</span></div>
      <a id="scrlink" target="_blank" rel="noopener"><img id="scrimg" alt="צילום מסך מהמשחק" hidden></a>
      <div class="empty" id="scrempty">עוד אין צילום מסך</div>
    </article>
    <article class="card shot">
      <div class="thead"><h2>🎒 אינוונטורי</h2><span class="badge" id="invlbl">–</span></div>
      <a id="invlink" target="_blank" rel="noopener"><img id="invimg" alt="צילום האינוונטורי מהמשחק" hidden></a>
      <div class="empty" id="invempty">עוד אין צילום של האינוונטורי</div>
    </article>
  </section>

  <div class="err" id="err" hidden></div>
  <footer id="foot"></footer>
</main>

<script>
(() => {
  const REFRESH_SEC = 90;  // GitHub allows 60 checks/hour per network without login
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

  // where the data lives: <user>.github.io/<repo>/ -> branch "data" of that repo
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  const repo = location.pathname.split("/").filter(Boolean)[0];
  const GH = m && repo ? { owner: m[1], repo } : null;

  let data = null, lastSha = null, slow = false, apiBlockedUntil = 0, nextCheck = 0;
  const shown = { screen: null, inventory: null };

  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), mm = Math.floor(sec % 3600 / 60), s = sec % 60;
    const pad = (n) => String(n).padStart(2, "0");
    return h ? `${h}:${pad(mm)}:${pad(s)}` : `${mm}:${pad(s)}`;
  }
  function ago(sec) {
    if (sec < 60) return "עכשיו";
    if (sec < 3600) return `לפני ${Math.round(sec / 60)} דק'`;
    return `לפני ${(sec / 3600).toFixed(1)} שע'`;
  }

  // Newest data: ask GitHub for the latest commit of the data branch (1 cheap call),
  // then read the files of exactly that commit (always fresh, no limit).
  // If GitHub rate-limits us, fall back to the branch files (can be ~5 min old).
  async function locate() {
    if (!GH) return { sha: "local", base: "" };
    if (Date.now() > apiBlockedUntil) {
      try {
        const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/git/ref/heads/data`, { cache: "no-store" });
        if (r.ok) {
          const sha = (await r.json()).object.sha;
          slow = false;
          return { sha, base: `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${sha}/` };
        }
        if (r.status === 403 || r.status === 429) {
          const reset = Number(r.headers.get("x-ratelimit-reset"));
          apiBlockedUntil = reset ? reset * 1000 : Date.now() + 10 * 60000;
        }
      } catch (e) { /* network hiccup -> fallback */ }
    }
    slow = true;
    return { sha: null, base: `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/data/` };
  }

  async function load() {
    nextCheck = Date.now() + REFRESH_SEC * 1000;
    try {
      const loc = await locate();
      const fixed = loc.sha && loc.sha !== "local";
      if (fixed && loc.sha === lastSha) { render(); return; }  // nothing new
      const bust = fixed ? "" : "?t=" + Date.now();
      const r = await fetch(loc.base + "status.json" + bust, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      data = await r.json();
      lastSha = loc.sha;
      setPic("screen", "scr", "screen.jpg", data.screen_updated, loc.base, bust);
      setPic("inventory", "inv", "inventory.jpg", data.inventory_updated, loc.base, bust);
      $("err").hidden = true;
    } catch (e) {
      $("err").hidden = false;
      $("err").textContent = "לא הצלחתי לטעון את הנתונים: " + e.message;
    }
    render();
  }

  function setPic(key, id, file, stamp, base, bust) {
    if (!stamp || stamp === shown[key]) return;
    const url = base + file + (bust || "?v=" + Math.round(stamp));
    const img = $(id + "img");
    img.onload = () => { img.hidden = false; $(id + "empty").hidden = true; shown[key] = stamp; };
    img.src = url;
    $(id + "link").href = url;
  }

  function potHtml(p, now) {
    let pct = 0, cls = "", eta = "", etaCls = "eta";
    const elapsed = p.last_empty ? now - p.last_empty : null;
    if (p.state === "ready") {
      pct = 100; cls = "ready"; eta = "מוכן לאיסוף!"; etaCls += " ready";
    } else if (elapsed != null && p.avg_grow_sec) {
      pct = Math.min(99, elapsed / p.avg_grow_sec * 100);
      const left = p.avg_grow_sec - elapsed;
      eta = left > 0 ? `עוד ${fmt(left)}` : "אמור להיות מוכן כל רגע";
    } else if (elapsed != null) {
      cls = "unknown"; eta = `מודד… ${fmt(elapsed)}`;
    } else {
      cls = "unknown"; eta = "מחכה לאיסוף הראשון";
    }
    const avg = p.avg_grow_sec ? `ממוצע ${fmt(p.avg_grow_sec)}` : "ממוצע: עוד אין";
    const last = p.last_grow_sec ? ` · אחרון ${fmt(p.last_grow_sec)}` : "";
    return `<div class="pot">
      <div class="prow"><b>${p.name === p.table ? "גדילה" : esc(p.name)}</b><span class="${etaCls}">${eta}</span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}">
        <div class="fill ${cls}" style="width:${pct}%"></div></div>
      <div class="meta"><span>${avg}${last}</span><span>${p.samples} מדידות</span><span>נאסף ${p.collected}×</span></div>
    </div>`;
  }

  function render() {
    const left = Math.max(0, Math.round((nextCheck - Date.now()) / 1000));
    $("foot").textContent = (slow ? "GitHub הגביל בדיקות - הנתונים יכולים להיות בני עד 5 דק' · " : "")
      + `בדיקה הבאה בעוד ${left} שנ' · ה-BAR זז כל שנייה לפי זמן הגדילה הממוצע`;
    if (!data) return;
    const now = Date.now() / 1000;
    const age = now - data.updated;
    const online = data.running && age < 8 * 60;
    $("dot").className = "dot " + (online ? "on" : "off");
    $("stxt").textContent = (online ? "הבוט פעיל" : (data.running ? "אין עדכון מהבוט" : "הבוט כבוי")) + ` · עודכן ${ago(age)}`;

    const pr = $("problem");
    pr.hidden = !data.problem;
    if (data.problem) pr.innerHTML = `⚠️ הבוט עצר: הדמות לא נמצאת בנקודה שלה<small>${esc(data.problem)}</small>`;
    $("scrlbl").textContent = data.screen_updated ? `צולם ${ago(now - data.screen_updated)} · כל 3 דק'` : "עוד לא צולם";
    $("invlbl").textContent = (data.inventory_updated ? `צולם ${ago(now - data.inventory_updated)}` : "עוד לא צולם")
      + ` · ${data.collections} איסופים`;

    const groups = new Map();
    for (const p of data.pots) {
      if (!groups.has(p.table)) groups.set(p.table, []);
      groups.get(p.table).push(p);
    }
    const tAvg = [...groups].map(([t, ps]) => {
      const a = ps.filter((p) => p.avg_grow_sec).map((p) => p.avg_grow_sec);
      return [t, a.length ? a.reduce((x, y) => x + y) / a.length : null];
    });
    const known = tAvg.filter(([, a]) => a);
    const slowest = known.length > 1 ? Math.max(...known.map(([, a]) => a)) : null;

    $("tables").innerHTML = [...groups].map(([t, ps], idx) => {
      const a = tAvg[idx][1];
      let badge = a ? `<span class="badge">ממוצע ${fmt(a)}</span>` : `<span class="badge">עוד לא נמדד</span>`;
      if (a && slowest && a < slowest * 0.97) {
        badge = `<span class="badge fast">⚡ מהיר ב-${Math.round((1 - a / slowest) * 100)}% · ${fmt(a)}</span>`;
      }
      return `<article class="card"><div class="thead"><h2>${esc(t)}</h2>${badge}</div>
        ${ps.map((p) => potHtml(p, now)).join("")}</article>`;
    }).join("");
  }

  load();
  // hidden tabs don't check, so several open tabs/phones don't use up GitHub's limit
  setInterval(() => { if (!document.hidden && Date.now() >= nextCheck) load(); }, 1000);
  setInterval(render, 1000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() >= nextCheck - 60000) load();
  });
})();
</script>
</body>
</html>
